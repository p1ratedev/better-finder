[package]
name = "bf-app"
description = "Better Finder: the macOS app (AppKit through objc2)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "better-finder"
path = "src/main.rs"

[dependencies]
bf-core.workspace = true
block2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dispatch2 = "0.3"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "objc2-uniform-type-identifiers",
    "NSAppearance",
    "NSApplication",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScrollView",
    "NSStringDrawing",
    "NSAttributedString",
    "NSText",
    "NSTextField",
    "NSTextView",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "NSAnimation",
    "NSButton",
    "NSImageView",
    "NSOutlineView",
    "NSSearchField",
    "NSSearchToolbarItem",
    "NSSplitView",
    "NSSplitViewController",
    "NSSplitViewItem",
    "NSTableCellView",
    "NSTableColumn",
    "NSTableRowView",
    "NSTableView",
    "NSTextFieldCell",
    "NSToolbar",
    "NSToolbarItem",
    "NSToolbarItemGroup",
    "NSTrackingSeparatorToolbarItem",
    "NSViewController",
    "NSUserInterfaceItemIdentification",
    "NSAccessibilityProtocols",
    "NSDragging",
    "NSUserInterfaceValidation",
    "NSNib",
    "NSTableHeaderView",
    "block2",
    "NSShadow",
    "NSAccessibility",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSArray",
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSRange",
    "NSString",
    "NSURL",
    "NSValue",
    "NSByteCountFormatter",
    "NSDate",
    "NSDateFormatter",
    "NSFormatter",
    "NSIndexSet",
    "NSUserDefaults",
    "NSEnumerator",
    "NSRunLoop",
] }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "QLPreviewItem", "QLPreviewPanel"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
